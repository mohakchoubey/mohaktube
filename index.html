
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>MohakTube</title>

<style>
/* =========================================================
   MOHAKTUBE
   Single-file YouTube-style video platform
   ========================================================= */

:root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f2f2f2;
    --surface-3: #e5e5e5;
    --text: #0f0f0f;
    --muted: #606060;
    --border: #e5e5e5;
    --accent: #ff0000;
    --accent-dark: #cc0000;
    --hover: #f2f2f2;
    --sidebar-width: 240px;
    --header-height: 64px;
}

body.dark {
    --bg: #0f0f0f;
    --surface: #0f0f0f;
    --surface-2: #272727;
    --surface-3: #3f3f3f;
    --text: #f1f1f1;
    --muted: #aaaaaa;
    --border: #303030;
    --hover: #272727;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
    transition: background .2s, color .2s;
}

button,
input {
    font: inherit;
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
    height: var(--header-height);
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: var(--surface);
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 18px;
    border-bottom: 1px solid var(--border);
}

.menu-btn {
    width: 40px;
    height: 40px;
    border: 0;
    background: transparent;
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    font-size: 22px;
}

.menu-btn:hover {
    background: var(--hover);
}

.logo {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    min-width: 170px;
}

.logo-icon {
    width: 34px;
    height: 24px;
    background: var(--accent);
    border-radius: 7px;
    position: relative;
}

.logo-icon::after {
    content: "";
    position: absolute;
    left: 13px;
    top: 6px;
    border-left: 10px solid white;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
}

.logo-text {
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -1px;
}

.logo-text span {
    color: var(--accent);
}

.search-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    max-width: 700px;
    margin: auto;
}

.search-box {
    display: flex;
    width: 100%;
    max-width: 640px;
    height: 40px;
}

.search-box input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 22px 0 0 22px;
    padding: 0 18px;
    outline: none;
    font-size: 16px;
}

.search-box input:focus {
    border-color: #777;
}

.search-button {
    width: 64px;
    border: 1px solid var(--border);
    border-left: 0;
    background: var(--surface-2);
    color: var(--text);
    border-radius: 0 22px 22px 0;
    cursor: pointer;
    font-size: 20px;
}

.search-button:hover {
    background: var(--surface-3);
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.header-btn {
    width: 40px;
    height: 40px;
    border: 0;
    background: transparent;
    color: var(--text);
    border-radius: 50%;
    cursor: pointer;
    font-size: 19px;
}

.header-btn:hover {
    background: var(--hover);
}

.channel-avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    overflow: hidden;
}

.channel-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;
    top: var(--header-height);
    left: 0;
    bottom: 0;
    width: var(--sidebar-width);
    padding: 14px 12px;
    background: var(--surface);
    overflow-y: auto;
    z-index: 900;
}

.sidebar-section {
    padding-bottom: 15px;
    margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
}

.sidebar-item {
    width: 100%;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 14px;
    border: 0;
    background: transparent;
    color: var(--text);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
}

.sidebar-item:hover,
.sidebar-item.active {
    background: var(--hover);
}

.sidebar-item .icon {
    width: 22px;
    text-align: center;
    font-size: 20px;
}

.sidebar-title {
    padding: 12px 14px 8px;
    color: var(--muted);
    font-size: 13px;
    font-weight: 700;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    margin-left: var(--sidebar-width);
    padding-top: var(--header-height);
    min-height: 100vh;
}

.content {
    padding: 24px 28px 50px;
    max-width: 1700px;
    margin: auto;
}

/* =========================================================
   CATEGORY BAR
   ========================================================= */

.category-bar {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 22px;
    scrollbar-width: none;
}

.category-bar::-webkit-scrollbar {
    display: none;
}

.category {
    flex-shrink: 0;
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    padding: 9px 15px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.category:hover {
    background: var(--surface-3);
}

.category.active {
    background: var(--text);
    color: var(--bg);
}

/* =========================================================
   PAGE TITLE
   ========================================================= */

.page-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0 22px;
}

.page-heading h1 {
    font-size: 22px;
}

.page-heading p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 5px;
}

/* =========================================================
   VIDEO GRID
   ========================================================= */

.video-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 34px 16px;
}

.video-card {
    min-width: 0;
    cursor: pointer;
}

.thumbnail {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    overflow: hidden;
    background: #222;
    position: relative;
}

.thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .2s;
}

.video-card:hover .thumbnail img {
    transform: scale(1.025);
}

.duration {
    position: absolute;
    bottom: 6px;
    right: 6px;
    padding: 3px 5px;
    background: rgba(0,0,0,.85);
    color: white;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
}

.short-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #000;
    color: white;
    padding: 4px 7px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
}

.video-details {
    display: flex;
    gap: 12px;
    padding-top: 11px;
}

.video-avatar {
    width: 36px;
    height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: hidden;
    background: var(--accent);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    font-weight: bold;
}

.video-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.video-text {
    min-width: 0;
}

.video-title {
    font-size: 14px;
    line-height: 1.45;
    font-weight: 600;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.video-meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 5px;
    line-height: 1.5;
}

/* =========================================================
   SHORTS
   ========================================================= */

.shorts-section {
    margin-top: 55px;
    padding-top: 28px;
    border-top: 1px solid var(--border);
}

.shorts-heading {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
}

.shorts-heading h2 {
    font-size: 21px;
}

.shorts-icon {
    color: var(--accent);
    font-size: 22px;
}

.shorts-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 15px;
}

.short-card {
    cursor: pointer;
    min-width: 0;
}

.short-thumbnail {
    aspect-ratio: 9 / 16;
    overflow: hidden;
    border-radius: 9px;
    position: relative;
    background: #222;
}

.short-thumbnail img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .2s;
}

.short-card:hover .short-thumbnail img {
    transform: scale(1.025);
}

.short-info {
    padding-top: 9px;
}

.short-title {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.short-meta {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

/* =========================================================
   WATCH PAGE
   ========================================================= */

.watch-page {
    display: none;
}

.watch-layout {
    display: grid;
    grid-template-columns: minmax(0, 2.2fr) minmax(300px, .8fr);
    gap: 24px;
}

.player-wrapper {
    width: 100%;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 10px;
    background: black;
}

.watch-title {
    font-size: 20px;
    line-height: 1.4;
    margin-top: 18px;
}

.watch-channel {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
}

.watch-channel-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    overflow: hidden;
}

.watch-channel-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.watch-channel-name {
    font-size: 14px;
    font-weight: 600;
}

.watch-channel-sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 4px;
}

.watch-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
}

.watch-action {
    border: 0;
    background: var(--surface-2);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}

.watch-action:hover {
    background: var(--surface-3);
}

.watch-description {
    background: var(--surface-2);
    padding: 15px;
    border-radius: 10px;
    margin-top: 15px;
    font-size: 13px;
    line-height: 1.6;
}

.related-title {
    font-size: 17px;
    margin-bottom: 15px;
}

.related-item {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
    cursor: pointer;
}

.related-thumb {
    width: 150px;
    aspect-ratio: 16 / 9;
    border-radius: 7px;
    overflow: hidden;
    flex-shrink: 0;
    background: #222;
}

.related-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.related-text {
    min-width: 0;
}

.related-text h3 {
    font-size: 13px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.related-text p {
    color: var(--muted);
    font-size: 11px;
    margin-top: 5px;
}

/* =========================================================
   HISTORY
   ========================================================= */

.history-empty {
    padding: 70px 20px;
    text-align: center;
    color: var(--muted);
}

.history-empty .big-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

/* =========================================================
   LOADING / EMPTY
   ========================================================= */

.empty-state {
    padding: 60px 20px;
    text-align: center;
    color: var(--muted);
}

.empty-state h2 {
    color: var(--text);
    margin-bottom: 8px;
}

/* =========================================================
   MOBILE
   ========================================================= */

.mobile-bottom {
    display: none;
}

@media (max-width: 1200px) {
    .video-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .shorts-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
    }
}

@media (max-width: 900px) {
    .sidebar {
        width: 72px;
        padding: 12px 8px;
    }

    .sidebar-item {
        justify-content: center;
        padding: 0;
    }

    .sidebar-item span:not(.icon),
    .sidebar-title {
        display: none;
    }

    .main {
        margin-left: 72px;
    }

    .logo {
        min-width: auto;
    }

    .logo-text {
        display: none;
    }

    .watch-layout {
        grid-template-columns: 1fr;
    }

    .shorts-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    :root {
        --header-height: 56px;
    }

    .header {
        padding: 0 10px;
        gap: 8px;
    }

    .menu-btn {
        display: none;
    }

    .logo {
        min-width: auto;
    }

    .search-wrapper {
        order: 2;
    }

    .header-actions {
        order: 3;
    }

    .header-btn {
        display: none;
    }

    .channel-avatar {
        width: 30px;
        height: 30px;
    }

    .sidebar {
        display: none;
    }

    .main {
        margin-left: 0;
        padding-bottom: 65px;
    }

    .content {
        padding: 18px 12px 30px;
    }

    .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 25px 10px;
    }

    .video-details {
        gap: 7px;
    }

    .video-avatar {
        display: none;
    }

    .video-title {
        font-size: 13px;
    }

    .shorts-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .watch-layout {
        gap: 18px;
    }

    .watch-title {
        font-size: 17px;
    }

    .related-thumb {
        width: 130px;
    }

    .mobile-bottom {
        position: fixed;
        display: flex;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        z-index: 1000;
        justify-content: space-around;
    }

    .mobile-bottom button {
        flex: 1;
        background: transparent;
        color: var(--text);
        border: 0;
        font-size: 11px;
        cursor: pointer;
    }

    .mobile-bottom .mobile-icon {
        display: block;
        font-size: 21px;
        margin-bottom: 2px;
    }
}

/* =========================================================
   SIDEBAR OVERLAY ON SMALL DESKTOP
   ========================================================= */

.sidebar.collapsed {
    width: 72px;
}

.sidebar.collapsed .sidebar-item {
    justify-content: center;
    padding: 0;
}

.sidebar.collapsed .sidebar-item span:not(.icon),
.sidebar.collapsed .sidebar-title {
    display: none;
}

.main.sidebar-collapsed {
    margin-left: 72px;
}
</style>
</head>

<body>

<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="header">

    <button class="menu-btn" onclick="toggleSidebar()" title="Menu">
        ☰
    </button>

    <div class="logo" onclick="showHome()">
        <div class="logo-icon"></div>
        <div class="logo-text">Mohak<span>Tube</span></div>
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <input
                id="searchInput"
                type="search"
                placeholder="Search"
                autocomplete="off"
                oninput="handleSearch()"
            >
            <button class="search-button" onclick="handleSearch()">
                🔍
            </button>
        </div>
    </div>

    <div class="header-actions">

        <button
            class="header-btn"
            onclick="toggleDarkMode()"
            id="themeButton"
            title="Toggle theme">
            ☾
        </button>

        <button
            class="header-btn"
            onclick="showHistory()"
            title="History">
            ◷
        </button>

        <div class="channel-avatar" id="headerAvatar">
            MC
        </div>

    </div>

</header>


<!-- =======================================================
     SIDEBAR
     ======================================================= -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-section">

        <button class="sidebar-item active" onclick="showHome()">
            <span class="icon">⌂</span>
            <span>Home</span>
        </button>

        <button class="sidebar-item" onclick="showShorts()">
            <span class="icon">▶</span>
            <span>Shorts</span>
        </button>

        <button class="sidebar-item" onclick="showHistory()">
            <span class="icon">◷</span>
            <span>History</span>
        </button>

    </div>

    <div class="sidebar-section">

        <div class="sidebar-title">You</div>

        <button class="sidebar-item" onclick="showLiked()">
            <span class="icon">♡</span>
            <span>Liked videos</span>
        </button>

        <button class="sidebar-item" onclick="showChannel()">
            <span class="icon">◎</span>
            <span>Your channel</span>
        </button>

    </div>

    <div class="sidebar-section">

        <div class="sidebar-title">Explore</div>

        <button class="sidebar-item" onclick="filterCategory('AI')">
            <span class="icon">✦</span>
            <span>AI</span>
        </button>

        <button class="sidebar-item" onclick="filterCategory('Technology')">
            <span class="icon">▣</span>
            <span>Technology</span>
        </button>

        <button class="sidebar-item" onclick="filterCategory('Education')">
            <span class="icon">▤</span>
            <span>Education</span>
        </button>

    </div>

    <div class="sidebar-section">

        <button class="sidebar-item" onclick="toggleDarkMode()">
            <span class="icon">◐</span>
            <span>Appearance</span>
        </button>

    </div>

</aside>


<!-- =======================================================
     MAIN
     ======================================================= -->

<main class="main" id="main">

    <div class="content">

        <!-- HOME PAGE -->

        <section id="homePage">

            <div class="category-bar" id="categoryBar"></div>

            <div class="page-heading">

                <div>
                    <h1 id="homeHeading">Recommended</h1>
                    <p id="homeSubheading">
                        Videos from Mohak Choubey
                    </p>
                </div>

            </div>

            <div class="video-grid" id="videoGrid"></div>


            <!-- SHORTS -->

            <section class="shorts-section">

                <div class="shorts-heading">
                    <span class="shorts-icon">▶</span>

                    <h2>
                        Shorts
                        (<span id="shortsCount">0</span>)
                    </h2>
                </div>

                <div
                    class="shorts-grid"
                    id="shortsGrid">
                </div>

            </section>

        </section>


        <!-- WATCH PAGE -->

        <section id="watchPage" class="watch-page">

            <div class="watch-layout">

                <div class="player-wrapper">

                    <iframe
                        id="videoPlayer"
                        class="player"
                        src=""
                        title="MohakTube video player"
                        frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen>
                    </iframe>

                    <h1
                        class="watch-title"
                        id="watchTitle">
                    </h1>

                    <div class="watch-channel">

                        <div
                            class="watch-channel-avatar"
                            id="watchAvatar">
                            MC
                        </div>

                        <div>
                            <div class="watch-channel-name">
                                Mohak Choubey
                            </div>

                            <div class="watch-channel-sub">
                                MohakTube
                            </div>
                        </div>

                    </div>

                    <div class="watch-actions">

                        <button
                            class="watch-action"
                            onclick="toggleLikeCurrent()"
                            id="likeButton">
                            ♡ Like
                        </button>

                        <button
                            class="watch-action"
                            onclick="shareCurrent()">
                            ↗ Share
                        </button>

                        <button
                            class="watch-action"
                            onclick="showHome()">
                            ← Back
                        </button>

                    </div>

                    <div
                        class="watch-description"
                        id="watchDescription">
                    </div>

                </div>


                <aside>

                    <h2 class="related-title">
                        Up next
                    </h2>

                    <div id="relatedVideos"></div>

                </aside>

            </div>

        </section>


        <!-- GENERAL PAGE -->

        <section
            id="generalPage"
            class="watch-page">
        </section>

    </div>

</main>


<!-- =======================================================
     MOBILE NAVIGATION
     ======================================================= -->

<nav class="mobile-bottom">

    <button onclick="showHome()">
        <span class="mobile-icon">⌂</span>
        Home
    </button>

    <button onclick="showShorts()">
        <span class="mobile-icon">▶</span>
        Shorts
    </button>

    <button onclick="showHistory()">
        <span class="mobile-icon">◷</span>
        History
    </button>

    <button onclick="showChannel()">
        <span class="mobile-icon">◎</span>
        You
    </button>

</nav>


<script>

/* =========================================================
   MOHAKTUBE DATA
   ========================================================= */

/*
   CHANNEL LOGO

   Leave empty to use "MC".

   Later you can put:
   const CHANNEL_LOGO = "https://yourwebsite.com/logo.png";
*/

const CHANNEL_LOGO = "https://mohakchoubey.github.io/mohaktube/id-123371eb4u92urhijamohak99.png";


/* =========================================================
   REGULAR VIDEOS

   Add future regular videos here.

   You can use ONLY the YouTube URL.
   The website extracts the video ID automatically.

/* =========================================================
   HELPERS
   ========================================================= */

function getVideoId(url) {

    if (!url) return null;

    const patterns = [

        /youtu\.be\/([^?&/]+)/,
        /youtube\.com\/watch\?v=([^?&/]+)/,
        /youtube\.com\/shorts\/([^?&/]+)/,
        /youtube\.com\/embed\/([^?&/]+)/

    ];

    for (const pattern of patterns) {

        const match = url.match(pattern);

        if (match) {
            return match[1];
        }

    }

    return null;
}


function getThumbnail(id, quality = "hqdefault") {

    return `https://img.youtube.com/vi/${id}/${quality}.jpg`;

}


function getEmbed(id) {

    return `https://www.youtube.com/embed/${id}`;

}


function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}

function guessCategory(title) {

    const t = title.toLowerCase();

    if (
        t.includes("ai") ||
        t.includes("chatgpt") ||
        t.includes("agent") ||
        t.includes("agi") ||
        t.includes("model") ||
        t.includes("gpt")
    ) {
        return "AI";
    }

    if (
        t.includes("sim") ||
        t.includes("wifi") ||
        t.includes("router") ||
        t.includes("gps") ||
        t.includes("cloud") ||
        t.includes("storage") ||
        t.includes("netflix")
    ) {
        return "Technology";
    }

    if (
        t.includes("math") ||
        t.includes("science") ||
        t.includes("compression")
    ) {
        return "Education";
    }

    return "Entertainment";
}

   ========================================================= */

function getAllContent() {

    const regular = VIDEOS.map((video, index) => {

        const id = getVideoId(video.url);

        return {

            id,
            url: video.url,
            title: video.title,
            category: video.category || "Technology",
            type: "video",
            order: index

        };

    });

    return [
        ...regular,
        ...SHORTS.map((short, index) => ({
            ...short,
            order: index
        }))
    ];

}


/* =========================================================
   RECOMMENDATION ALGORITHM
   ========================================================= */

function getRecommendations(list) {

    return [...list].sort((a, b) => {

        const score = video => {

            let points = 0;

            // Popularity
            if (video.type === "short") {
                points += Math.min(
                    video.views / 100,
                    5
                );
            }

            // History
            const historyIndex =
                watchHistory.indexOf(video.id);

            if (historyIndex === 0) {
                points -= 5;
            } else if (historyIndex > 0) {
                points -= 2;
            }

            // Likes
            if (likedVideos.includes(video.id)) {
                points += 3;
            }

            // Category preference
            const categoryHistory =
                watchHistory
                    .map(id =>
                        getAllContent()
                            .find(v => v.id === id)
                    )
                    .filter(Boolean);

            const categoryCount =
                categoryHistory.filter(
                    v => v.category === video.category
                ).length;

            points += categoryCount * 2;

            // Small randomization
            points += Math.random();

            return points;

        };

        return score(b) - score(a);

    });

}

/* =========================================================
   VIEW COUNT FORMAT
   ========================================================= */

function formatViews(number) {

    if (number >= 1000000) {
        return (number / 1000000)
            .toFixed(1)
            .replace(".0", "") + "M";
    }

    if (number >= 1000) {
        return (number / 1000)
            .toFixed(1)
            .replace(".0", "") + "K";
    }

    return number.toString();

}

    const url =
        location.href.split("#")[0] +

    if (navigator.share) {

        try {

            await navigator.share({
                title: currentVideo.title,
                text: "Watch this on MohakTube",
                url
            });

        } catch (error) {}

    } else {

        try {

            await navigator.clipboard.writeText(url);

            alert("MohakTube video link copied!");

        } catch (error) {

            prompt(
                "Copy this link:",
                url
            );

        }

    }

}

                    ">
                        ${VIDEOS.length} videos ·
                        ${SHORTS.length} Shorts
                    </p>

                </div>

            </div>

            <div class="page-heading">

                <div>
                    <h1>Videos</h1>
                </div>

            </div>

            <div class="video-grid">
                ${VIDEOS.map(video => {

                    const id =
                        getVideoId(video.url);

                    return createVideoCard({
                        ...video,
                        id,
                        type: "video"
                    });

                }).join("")}
            </div>

        `;

}


/* =========================================================
   CATEGORY FILTER
   ========================================================= */

function filterCategory(category) {

    hideAllPages();

    document.getElementById("homePage")
        .style.display = "block";

    currentCategory = category;

    renderCategories();

    let content =
        getAllContent();

    if (category !== "All") {

        content =
            content.filter(
                video =>
                    video.category === category
            );

    }

    content =
        getRecommendations(content);

    document.getElementById("homeHeading")
        .textContent = category === "All"
            ? "Recommended"
            : category;

    document.getElementById("homeSubheading")
        .textContent =
            `${content.length} videos`;

    renderVideos(
        content.filter(
            video => video.type === "video"
        )
    );

    renderShorts(
        content.filter(
            video => video.type === "short"
        )
    );

}


/* =========================================================
   SEARCH
   ========================================================= */

function handleSearch() {

    const query =
        document.getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    if (!query) {

        showHome();

        return;

    }

    hideAllPages();

    document.getElementById("homePage")
        .style.display = "block";

    const results =
        getRecommendations(
            getAllContent().filter(video =>
                video.title
                    .toLowerCase()
                    .includes(query) ||

                video.category
                    .toLowerCase()
                    .includes(query)
            )
        );

    document.getElementById("homeHeading")
        .textContent = "Search results";

    document.getElementById("homeSubheading")
        .textContent =
            `${results.length} results for "${query}"`;

    renderVideos(
        results.filter(
            video => video.type === "video"
        )
    );

    renderShorts(
        results.filter(
            video => video.type === "short"
        )
    );

}


/* =========================================================
   HIDE PAGES
   ========================================================= */

function hideAllPages() {

    document.getElementById("homePage")
        .style.display = "none";

    document.getElementById("watchPage")
        .style.display = "none";

    document.getElementById("generalPage")
        .style.display = "none";

}


/* =========================================================
   SIDEBAR
   ========================================================= */

function toggleSidebar() {

    const sidebar =
        document.getElementById("sidebar");

    const main =
        document.getElementById("main");

    sidebar.classList.toggle("collapsed");

    main.classList.toggle("sidebar-collapsed");

}


/* =========================================================
   HASH ROUTING
   ========================================================= */

function checkHash() {

    const hash =
        location.hash;

    if (hash.startsWith("#video=")) {

        const id =
            hash.replace("#video=", "");

        if (
            getAllContent()
                .some(v => v.id === id)
        ) {

            openContent(id);

        }

    }

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function init() {

    applyTheme();

    applyChannelLogo();

    renderCategories();

    renderVideos(
        getRecommendations(
            VIDEOS.map((video, index) => ({
                ...video,
                id: getVideoId(video.url),
                type: "video",
                order: index
            }))
        )
    );

    renderShorts();

    checkHash();

}


window.addEventListener(
    "hashchange",
    checkHash
);

init();

</script>

</body>
</html>
