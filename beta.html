<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohakube</title>

<style>
:root{
  --bg:#fff;
  --surface:#fff;
  --surface2:#f2f2f2;
  --text:#0f0f0f;
  --muted:#606060;
  --border:#e5e5e5;
  --hover:#f2f2f2;
  --accent:#ff0033;
  --header:64px;
  --sidebar:240px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

body.dark{
  --bg:#0f0f0f;
  --surface:#0f0f0f;
  --surface2:#272727;
  --text:#fff;
  --muted:#aaa;
  --border:#303030;
  --hover:#272727;
}

/* ================= HEADER ================= */

.header{
  height:var(--header);
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 20px;
}

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:var(--text);
  border-radius:50%;
  font-size:23px;
  cursor:pointer;
}

.menu-btn:hover{
  background:var(--hover);
}

.brand{
  display:flex;
  align-items:center;
  gap:8px;
  min-width:180px;
  cursor:pointer;
}

.brand-mark{
  width:34px;
  height:24px;
  border-radius:7px;
  background:var(--accent);
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.brand-mark::after{
  content:"";
  width:0;
  height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-left:9px solid white;
  margin-left:2px;
}

.brand-name{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.7px;
}

.search-area{
  flex:1;
  display:flex;
  max-width:720px;
  margin:auto;
}

.search-box{
  flex:1;
  height:42px;
  border:1px solid var(--border);
  border-right:0;
  border-radius:22px 0 0 22px;
  background:var(--bg);
  color:var(--text);
  padding:0 18px;
  font-size:16px;
  outline:none;
}

.search-box:focus{
  border-color:#777;
}

.search-btn{
  width:62px;
  border:1px solid var(--border);
  border-radius:0 22px 22px 0;
  background:var(--surface2);
  color:var(--text);
  cursor:pointer;
  font-size:19px;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:20px;
}

.icon-btn:hover{
  background:var(--hover);
}

.profile{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  background:var(--surface2);
}

/* ================= SIDEBAR ================= */

.sidebar{
  position:fixed;
  top:var(--header);
  left:0;
  bottom:0;
  width:var(--sidebar);
  background:var(--surface);
  padding:14px 12px;
  border-right:1px solid var(--border);
  overflow-y:auto;
  z-index:900;
}

.side-item{
  width:100%;
  min-height:46px;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 16px;
  border-radius:10px;
  border:0;
  background:transparent;
  color:var(--text);
  cursor:pointer;
  font-size:14px;
  text-align:left;
}

.side-item:hover,
.side-item.active{
  background:var(--hover);
  font-weight:600;
}

.side-icon{
  width:22px;
  text-align:center;
  font-size:19px;
}

.side-title{
  padding:18px 16px 8px;
  font-size:13px;
  font-weight:700;
  color:var(--muted);
  text-transform:uppercase;
}

/* ================= MAIN ================= */

.main{
  margin-left:var(--sidebar);
  padding-top:var(--header);
  min-height:100vh;
}

.content{
  padding:22px 28px 50px;
  max-width:1800px;
  margin:auto;
}

/* ================= CATEGORY BAR ================= */

.category-bar{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:18px;
  scrollbar-width:none;
}

.category-bar::-webkit-scrollbar{
  display:none;
}

.chip{
  border:0;
  background:var(--surface2);
  color:var(--text);
  padding:9px 15px;
  border-radius:8px;
  white-space:nowrap;
  cursor:pointer;
  font-size:14px;
}

.chip.active{
  background:var(--text);
  color:var(--bg);
}

/* ================= SECTION HEADER ================= */

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin:10px 0 20px;
}

.section-title{
  font-size:23px;
  font-weight:700;
}

.sort-area{
  display:flex;
  gap:8px;
  background:var(--surface2);
  padding:4px;
  border-radius:10px;
}

.sort-btn{
  border:0;
  background:transparent;
  color:var(--text);
  padding:8px 12px;
  border-radius:7px;
  cursor:pointer;
  font-size:13px;
}

.sort-btn.active{
  background:var(--surface);
  box-shadow:0 1px 5px rgba(0,0,0,.12);
  font-weight:700;
}

/* ================= VIDEO GRID ================= */

.video-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:30px 18px;
}

.video-card{
  cursor:pointer;
  min-width:0;
}

.thumbnail{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:10px;
  overflow:hidden;
  background:var(--surface2);
}

.thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .2s ease;
}

.video-card:hover .thumbnail img{
  transform:scale(1.02);
}

.duration{
  position:absolute;
  bottom:7px;
  right:7px;
  background:rgba(0,0,0,.85);
  color:white;
  font-size:12px;
  padding:3px 5px;
  border-radius:3px;
}

.video-info{
  display:flex;
  gap:12px;
  padding-top:11px;
}

.avatar{
  width:36px;
  height:36px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  background:var(--surface2);
}

.video-text{
  min-width:0;
}

.video-title{
  font-size:15px;
  line-height:1.35;
  font-weight:600;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.video-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
  line-height:1.4;
}

/* ================= SHORTS ================= */

.shorts-section{
  margin-top:45px;
}

.shorts-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:18px;
}

.short-card{
  cursor:pointer;
}

.short-thumb{
  position:relative;
  aspect-ratio:9/16;
  border-radius:10px;
  overflow:hidden;
  background:var(--surface2);
}

.short-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.short-play{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  opacity:0;
  background:rgba(0,0,0,.18);
  transition:.2s;
}

.short-card:hover .short-play{
  opacity:1;
}

.play-circle{
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,.72);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.short-title{
  margin-top:9px;
  font-size:14px;
  font-weight:600;
  line-height:1.35;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.short-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

/* ================= WATCH PAGE ================= */

.watch-page{
  display:none;
}

.watch-layout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  gap:25px;
}

.player{
  width:100%;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
  background:#000;
}

.watch-title{
  margin-top:16px;
  font-size:22px;
  font-weight:700;
}

.watch-meta{
  margin-top:10px;
  color:var(--muted);
}

.watch-actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.action-btn{
  border:0;
  background:var(--surface2);
  color:var(--text);
  border-radius:20px;
  padding:10px 16px;
  cursor:pointer;
  font-size:14px;
}

.action-btn:hover{
  background:var(--hover);
}

.related-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:15px;
}

.related-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.related-card{
  display:flex;
  gap:10px;
  cursor:pointer;
}

.related-thumb{
  width:150px;
  aspect-ratio:16/9;
  border-radius:8px;
  object-fit:cover;
}

.related-text{
  min-width:0;
}

.related-name{
  font-size:14px;
  font-weight:600;
  line-height:1.35;
}

/* ================= HISTORY ================= */

.history-empty{
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
  font-size:15px;
}

/* ================= FOOTER ================= */

.footer{
  border-top:1px solid var(--border);
  margin-top:50px;
  padding:30px 10px 90px;
  color:var(--muted);
}

.footer-inner{
  max-width:1000px;
  margin:auto;
  text-align:center;
}

.footer-brand{
  color:var(--text);
  font-size:20px;
  font-weight:800;
  margin-bottom:15px;
}

.footer-links{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:20px;
  margin-bottom:18px;
}

.footer-links button{
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
}

.footer-links button:hover{
  color:var(--text);
}

.footer-copy{
  font-size:12px;
}

/* ================= MOBILE NAV ================= */

.mobile-nav{
  display:none;
}

/* ================= EMPTY ================= */

.no-results{
  padding:60px 20px;
  text-align:center;
  color:var(--muted);
}

/* ================= RESPONSIVE ================= */

@media(max-width:1400px){
  .video-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .shorts-grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }
}

@media(max-width:1100px){
  .video-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }

  .shorts-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .watch-layout{
    grid-template-columns:1fr;
  }
}

@media(max-width:800px){
  :root{
    --header:58px;
  }

  .header{
    padding:0 10px;
    gap:7px;
  }

  .menu-btn{
    display:none;
  }

  .brand{
    min-width:auto;
  }

  .brand-name{
    font-size:19px;
  }

  .brand-mark{
    width:30px;
    height:22px;
  }

  .search-area{
    max-width:none;
    margin-left:4px;
  }

  .search-box{
    height:38px;
    font-size:14px;
    padding:0 13px;
  }

  .search-btn{
    width:45px;
  }

  .header-actions{
    gap:0;
  }

  .header-actions .icon-btn{
    display:none;
  }

  .profile{
    width:32px;
    height:32px;
  }

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
  }

  .content{
    padding:14px 10px 20px;
  }

  .category-bar{
    padding-bottom:12px;
  }

  .chip{
    padding:8px 13px;
    font-size:13px;
  }

  .section-header{
    margin:7px 0 15px;
    align-items:flex-start;
    flex-direction:column;
  }

  .section-title{
    font-size:20px;
  }

  .sort-area{
    width:100%;
    overflow-x:auto;
  }

  .sort-btn{
    flex:1;
    white-space:nowrap;
  }

  .video-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:25px 10px;
  }

  .video-info{
    gap:8px;
    padding-top:8px;
  }

  .avatar{
    width:30px;
    height:30px;
  }

  .video-title{
    font-size:13px;
  }

  .video-meta{
    font-size:11px;
  }

  .shorts-section{
    margin-top:35px;
  }

  .shorts-grid{
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:12px;
  }

  .short-title{
    font-size:13px;
  }

  .watch-layout{
    gap:18px;
  }

  .player{
    border-radius:0;
    width:calc(100% + 20px);
    margin-left:-10px;
  }

  .watch-title{
    font-size:18px;
  }

  .related-thumb{
    width:125px;
  }

  .footer{
    padding-bottom:90px;
  }

  .mobile-nav{
    position:fixed;
    display:flex;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    background:var(--surface);
    border-top:1px solid var(--border);
    z-index:1200;
    justify-content:space-around;
    padding-bottom:env(safe-area-inset-bottom);
  }

  .mobile-nav button{
    flex:1;
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:4px;
  }

  .mobile-nav button.active{
    color:var(--text);
    font-weight:700;
  }

  .mobile-nav .nav-icon{
    font-size:21px;
  }
}

@media(max-width:480px){
  .brand-name{
    display:none;
  }

  .brand{
    min-width:32px;
  }

  .search-area{
    margin-left:0;
  }

  .search-box{
    min-width:0;
  }

  .video-grid{
    gap:22px 8px;
  }

  .video-title{
    font-size:12.5px;
  }

  .video-meta{
    font-size:10.5px;
  }

  .avatar{
    display:none;
  }

  .shorts-grid{
    gap:10px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <button class="menu-btn" onclick="toggleSidebar()" aria-label="Menu">
    ☰
  </button>

  <div class="brand" onclick="goHome()">
    <div class="brand-mark"></div>
    <div class="brand-name">Mohakube</div>
  </div>

  <div class="search-area">
    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="Search"
      autocomplete="off"
    >
    <button class="search-btn" onclick="searchVideos()">⌕</button>
  </div>

  <div class="header-actions">
    <button class="icon-btn" onclick="toggleTheme()" title="Theme">
      ◐
    </button>

    <button class="icon-btn" onclick="showHistory()" title="History">
      ◷
    </button>

    <img id="profileTop" class="profile" alt="Profile">
  </div>

</header>

<!-- ================= SIDEBAR ================= -->

<aside class="sidebar" id="sidebar">

  <button class="side-item active" onclick="goHome()">
    <span class="side-icon">⌂</span>
    Home
  </button>

  <button class="side-item" onclick="showShorts()">
    <span class="side-icon">▶</span>
    Shorts
  </button>

  <button class="side-item" onclick="showHistory()">
    <span class="side-icon">◷</span>
    History
  </button>

  <button class="side-item" onclick="showLiked()">
    <span class="side-icon">♡</span>
    Liked videos
  </button>

  <div class="side-title">Explore</div>

  <button class="side-item" onclick="sortVideos('latest')">
    <span class="side-icon">◉</span>
    Latest
  </button>

  <button class="side-item" onclick="sortVideos('popular')">
    <span class="side-icon">↗</span>
    Popular
  </button>

  <button class="side-item" onclick="sortVideos('oldest')">
    <span class="side-icon">◌</span>
    Oldest
  </button>

  <div class="side-title">More</div>

  <button class="side-item" onclick="toggleTheme()">
    <span class="side-icon">◐</span>
    Dark / Light
  </button>

</aside>

<!-- ================= MAIN ================= -->

<main class="main">

  <div class="content">

    <!-- HOME PAGE -->

    <section id="homePage">

      <div class="category-bar">
        <button class="chip active" onclick="filterCategory('All',this)">
          All
        </button>

        <button class="chip" onclick="filterCategory('Technology',this)">
          Technology
        </button>

        <button class="chip" onclick="filterCategory('AI',this)">
          AI
        </button>

        <button class="chip" onclick="filterCategory('Data Science',this)">
          Data Science
        </button>

        <button class="chip" onclick="filterCategory('Education',this)">
          Education
        </button>
      </div>

      <div class="section-header">

        <h1 class="section-title" id="feedTitle">
          Recommended videos
        </h1>

        <div class="sort-area">

          <button
            class="sort-btn active"
            data-sort="latest"
            onclick="sortVideos('latest')">
            Latest
          </button>

          <button
            class="sort-btn"
            data-sort="popular"
            onclick="sortVideos('popular')">
            Popular
          </button>

          <button
            class="sort-btn"
            data-sort="oldest"
            onclick="sortVideos('oldest')">
            Oldest
          </button>

        </div>

      </div>

      <div id="videoGrid" class="video-grid"></div>

      <!-- SHORTS -->

      <section class="shorts-section">

        <div class="section-header">

          <h2 class="section-title">
            Shorts
          </h2>

          <div class="sort-area">

            <button
              class="sort-btn active"
              data-short-sort="latest"
              onclick="sortShorts('latest')">
              Latest
            </button>

            <button
              class="sort-btn"
              data-short-sort="popular"
              onclick="sortShorts('popular')">
              Popular
            </button>

            <button
              class="sort-btn"
              data-short-sort="oldest"
              onclick="sortShorts('oldest')">
              Oldest
            </button>

          </div>

        </div>

        <div id="shortsGrid" class="shorts-grid"></div>

      </section>

    </section>

    <!-- WATCH PAGE -->

    <section id="watchPage" class="watch-page">

      <div class="watch-layout">

        <div>

          <iframe
            id="player"
            class="player"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share">
          </iframe>

          <h1 id="watchTitle" class="watch-title"></h1>

          <div id="watchMeta" class="watch-meta"></div>

          <div class="watch-actions">

            <button class="action-btn" onclick="likeCurrentVideo()">
              ♡ Like
            </button>

            <button class="action-btn" onclick="goHome()">
              ← Back
            </button>

          </div>

        </div>

        <aside>

          <h2 class="related-title">
            Up next
          </h2>

          <div id="relatedList" class="related-list"></div>

        </aside>

      </div>

    </section>

    <!-- HISTORY PAGE -->

    <section id="historyPage" style="display:none">

      <div class="section-header">
        <h1 class="section-title">Watch history</h1>

        <button
          class="action-btn"
          onclick="clearHistory()">
          Clear history
        </button>
      </div>

      <div id="historyGrid" class="video-grid"></div>

    </section>

    <!-- LIKED PAGE -->

    <section id="likedPage" style="display:none">

      <div class="section-header">
        <h1 class="section-title">Liked videos</h1>
      </div>

      <div id="likedGrid" class="video-grid"></div>

    </section>

    <!-- FOOTER -->

    <footer class="footer">

      <div class="footer-inner">

        <div class="footer-brand">
          Mohakube
        </div>

        <div class="footer-links">

          <button onclick="goHome()">Home</button>
          <button onclick="showShorts()">Shorts</button>
          <button onclick="showHistory()">History</button>
          <button onclick="showLiked()">Liked</button>
          <button onclick="toggleTheme()">Theme</button>
          <button onclick="showAbout()">About</button>
          <button onclick="showTerms()">Terms</button>
          <button onclick="showPrivacy()">Privacy</button>

        </div>

        <div class="footer-copy">
          © 2026 Mohakube. All rights reserved.
        </div>

      </div>

    </footer>

  </div>

</main>

<!-- ================= MOBILE NAV ================= -->

<nav class="mobile-nav">

  <button class="active" onclick="goHome()">
    <span class="nav-icon">⌂</span>
    Home
  </button>

  <button onclick="showShorts()">
    <span class="nav-icon">▶</span>
    Shorts
  </button>

  <button onclick="showHistory()">
    <span class="nav-icon">◷</span>
    History
  </button>

/* =========================================================

========================================================= */

function getId(url){

  if(!url) return "";

  const match = url.match(
    /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([^?&/]+)/
  );

  return match ? match[1] : "";
}


function thumbnail(id){

  return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;

}


function embedUrl(id){

  return `https://www.youtube.com/embed/${id}?autoplay=1&rel=0`;

}


function formatViews(num){

  num = Number(num) || 0;

  if(num >= 1000000){
    return (num / 1000000).toFixed(1) + "M views";
  }

  if(num >= 1000){
    return (num / 1000).toFixed(1) + "K views";
  }

  return num + " views";

}


function logo(){

  return CHANNEL_LOGO ||
    "https://www.gstatic.com/youtube/img/branding/youtubelogo/svg/youtubelogo.svg";

}

    views:
      SHORT_VIEWS[id] || 0,

    date:

      btn.dataset.sort === type
    );
  });

  renderVideos();

}


function sortedVideos(list){

  const copy = [...list];

  if(currentSort === "popular"){

    copy.sort((a,b)=>
      Number(b.views || 0) -
      Number(a.views || 0)
    );

  }else if(currentSort === "oldest"){

    copy.sort((a,b)=>
      new Date(a.date) -
      new Date(b.date)
    );

  }else{

    copy.sort((a,b)=>
      new Date(b.date) -
      new Date(a.date)
    );

  }

  return copy;

}

  const video =

  const data = video || short;

  if(!data) return;

  addToHistory(id);

  document.getElementById("homePage").style.display = "none";
  document.getElementById("historyPage").style.display = "none";
  document.getElementById("likedPage").style.display = "none";

  const watch =
    document.getElementById("watchPage");

  watch.style.display = "block";

  document.getElementById("player").src =
    embedUrl(id);

  document.getElementById("watchTitle").textContent =
    data.title;

  document.getElementById("watchMeta").textContent =
    `Mohak Choubey • ${formatViews(data.views || 0)}`;

  renderRelated(id);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

    JSON.stringify(history)

function searchVideos(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!query){

    goHome();
    return;

  }

  hidePages();

  document.getElementById("homePage").style.display =
    "block";

  document.getElementById("feedTitle").textContent =
    `Search results for "${query}"`;

  const grid =
    document.getElementById("videoGrid");

  const regular =
    VIDEOS.filter(v=>
      `${v.title} ${v.category}`
        .toLowerCase()
        .includes(query)
    );

  const shorts =
    SHORTS.filter(v=>
      v.title
        .toLowerCase()
        .includes(query)
    );

  const results = [
    ...regular.map(v=>({
      ...v,
      isShort:false
    })),
    ...shorts.map(v=>({
      ...v,
      url:`https://www.youtube.com/watch?v=${v.id}`,
      isShort:true
    }))
  ];

  if(!results.length){

    grid.innerHTML =
      `<div class="no-results">
        No results found for "${escapeHtml(query)}".
      </div>`;

    return;

  }

  grid.innerHTML =
    results.map(video=>{

      const id =
        video.id || getId(video.url);

      return `

        <article
          class="video-card"
          onclick="openVideo('${id}')">

          <div class="thumbnail">

            <img
              src="${thumbnail(id)}"
              loading="lazy"
              alt="">

              alt="">

              <div class="video-meta">
                Mohak Choubey
                •
                ${formatViews(video.views)}
              </div>

            </div>

          </div>

        </article>

      `;

    }).join("");

}

  document.getElementById("feedTitle").textContent =
    category === "All"
      ? "Recommended videos"
      : category;

  renderVideos();

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}
