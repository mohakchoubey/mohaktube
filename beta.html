<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mohakube — Mohak Choubey Videos</title>

  <meta
    name="description"
    content="Mohakube — Watch Mohak Choubey videos and Shorts in a clean YouTube-style interface."
  >

  <meta
    name="keywords"
    content="Mohakube, Mohak Choubey, AI, technology, data science, videos, shorts"
  >

  <meta name="robots" content="index, follow">
  <meta name="author" content="Mohakube">
  <meta name="theme-color" content="#ffffff">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mohakube — Mohak Choubey Videos">
  <meta
    property="og:description"
    content="Watch Mohak Choubey videos and Shorts on Mohakube."
  >
  <meta property="og:image" content="favicon.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Mohakube — Mohak Choubey Videos">
  <meta
    name="twitter:description"
    content="Watch Mohak Choubey videos and Shorts on Mohakube."
  >
  <meta name="twitter:image" content="favicon.png">

  <!-- YouTube Subscribe Button -->
  <script src="https://apis.google.com/js/platform.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --card: #ffffff;
      --border: #e5e7eb;
      --sidebar: #ffffff;
      --chip: #f1f1f1;
      --chip-active: #111111;
      --chip-active-text: #ffffff;
      --header: rgba(255,255,255,.94);
      --danger: #ff0033;
      --shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    body.dark {
      --bg: #0f0f0f;
      --text: #f5f5f5;
      --muted: #a1a1aa;
      --card: #181818;
      --border: #2b2b2b;
      --sidebar: #111111;
      --chip: #272727;
      --chip-active: #ffffff;
      --chip-active-text: #111111;
      --header: rgba(15,15,15,.94);
      --shadow: 0 4px 18px rgba(0,0,0,.25);
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: .2s;
      min-height: 100vh;
    }

    button,
    input {
      font-family: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 64px;
      background: var(--header);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 190px;
      font-weight: 800;
      font-size: 23px;
      letter-spacing: -1px;
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
    }

    .brand-logo-fallback {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--danger);
      color: white;
      font-weight: 800;
      font-size: 15px;
    }

    .brand span {
      color: var(--danger);
    }

    .search-area {
      flex: 1;
      max-width: 720px;
      margin: auto;
      display: flex;
      align-items: center;
    }

    .search-box {
      width: 100%;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--bg);
      color: var(--text);
      padding: 0 18px;
      outline: none;
      font-size: 15px;
    }

    .search-box:focus {
      border-color: #888;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 19px;
    }

    .icon-btn:hover {
      background: var(--chip);
    }

    /* LAYOUT */

    .layout {
      display: flex;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      width: 220px;
      border-right: 1px solid var(--border);
      background: var(--sidebar);
      padding: 18px 12px;
      position: sticky;
      top: 64px;
      height: calc(100vh - 64px);
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 14px;
      border-radius: 10px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      text-align: left;
      margin-bottom: 5px;
    }

    .nav-item:hover,
    .nav-item.active {
      background: var(--chip);
      font-weight: 700;
    }

    .nav-icon {
      width: 22px;
      text-align: center;
    }

    .content {
      flex: 1;
      min-width: 0;
      padding: 24px 28px 90px;
    }

    /* CHANNEL */

    .channel-banner {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: var(--shadow);
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .channel-logo {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--chip);
      flex-shrink: 0;
    }

    .channel-placeholder {
      width: 78px;
      height: 78px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--danger);
      color: white;
      font-size: 28px;
      font-weight: 800;
      flex-shrink: 0;
    }

    .channel-text {
      flex: 1;
    }

    .channel-text h1 {
      font-size: 25px;
      margin-bottom: 5px;
    }

    .channel-text p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .subscribe-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
    }

    /* CHIPS */

    .chips {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 25px;
      scrollbar-width: none;
    }

    .chips::-webkit-scrollbar {
      display: none;
    }

    .chip {
      border: 0;
      border-radius: 9px;
      padding: 9px 15px;
      background: var(--chip);
      color: var(--text);
      white-space: nowrap;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .chip.active {
      background: var(--chip-active);
      color: var(--chip-active-text);
    }

    /* SECTION HEADER */

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
      gap: 15px;
    }

    .section-head h2 {
      font-size: 21px;
    }

    .sort-buttons {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
    }

    .sort-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .sort-btn.active {
      background: var(--text);
      color: var(--bg);
    }

    /* GRID */

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px 18px;
    }

    .video-card {
      cursor: pointer;
      min-width: 0;
    }

    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      border-radius: 11px;
      overflow: hidden;
      background: var(--chip);
      margin-bottom: 11px;
    }

    .thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }

    .video-card:hover .thumb {
      transform: scale(1.025);
    }

    .duration-badge {
      position: absolute;
      right: 7px;
      bottom: 7px;
      background: rgba(0,0,0,.85);
      color: white;
      font-size: 11px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .video-info {
      display: flex;
      gap: 10px;
    }

    .mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--chip);
      flex-shrink: 0;
    }

    .video-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .video-meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    /* SHORTS */

    .shorts-section {
      margin-top: 48px;
    }

    .shorts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
    }

    .short-card {
      cursor: pointer;
      min-width: 0;
    }

    .short-thumb-wrap {
      position: relative;
      aspect-ratio: 9 / 16;
      border-radius: 12px;
      overflow: hidden;
      background: var(--chip);
      margin-bottom: 9px;
    }

    .short-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .25s;
    }

    .short-card:hover .short-thumb {
      transform: scale(1.025);
    }

    .short-info {
      padding: 0 3px;
    }

    .short-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
    }

    .short-meta {
      font-size: 11px;
      color: var(--muted);
    }

    /* WATCH */

    .watch-page {
      display: none;
      max-width: 1100px;
      margin: auto;
    }

    .watch-page.active {
      display: block;
    }

    .home-page.hidden {
      display: none;
    }

    .back-btn {
      border: 0;
      background: var(--chip);
      color: var(--text);
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 18px;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 13px;
      background: black;
    }

    .watch-title {
      font-size: 23px;
      line-height: 1.35;
      margin: 17px 0 10px;
    }

    .watch-meta {
      color: var(--muted);
      font-size: 13px;
    }

    /* LOADING / ERROR */

    .status-box {
      padding: 25px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 25px;
    }

    .error-box {
      color: #d11;
      border-color: #e99;
    }

    body.dark .error-box {
      color: #ff8080;
      border-color: #633;
    }

    /* HISTORY */

    .history-empty {
      color: var(--muted);
      padding: 30px 0;
    }

    /* FOOTER */

    footer {
      border-top: 1px solid var(--border);
      margin-top: 55px;
      padding: 25px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.7;
    }

    /* MOBILE NAV */

    .mobile-nav {
      display: none;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {
      .sidebar {
        width: 75px;
      }

      .nav-item {
        justify-content: center;
        padding: 13px 8px;
      }

      .nav-label {
        display: none;
      }

      .brand {
        min-width: auto;
      }

      .brand-text {
        display: none;
      }
    }

    @media (max-width: 700px) {
      header {
        height: 58px;
        padding: 0 12px;
        gap: 10px;
      }

      .brand {
        font-size: 19px;
      }

      .brand-logo-fallback,
      .brand img {
        width: 32px;
        height: 32px;
      }

      .search-area {
        max-width: none;
      }

      .search-box {
        height: 38px;
      }

      .sidebar {
        display: none;
      }

      .content {
        padding: 15px 13px 85px;
      }

      .channel-info {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .channel-logo,
      .channel-placeholder {
        width: 62px;
        height: 62px;
      }

      .channel-placeholder {
        font-size: 22px;
      }

      .channel-text {
        min-width: calc(100% - 85px);
      }

      .channel-text h1 {
        font-size: 20px;
      }

      .subscribe-wrap {
        margin-left: 0;
        width: 100%;
        padding-left: 0;
      }

      .section-head {
        align-items: flex-start;
        flex-direction: column;
      }

      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px 10px;
      }

      .shorts-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .video-title {
        font-size: 12px;
      }

      .video-meta {
        font-size: 10px;
      }

      .mini-avatar {
        display: none;
      }

      .mobile-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        height: 62px;
        display: flex;
        justify-content: space-around;
        align-items: center;
        background: var(--header);
        backdrop-filter: blur(12px);
        border-top: 1px solid var(--border);
      }

      .mobile-nav button {
        border: 0;
        background: transparent;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        font-size: 10px;
        cursor: pointer;
      }

      .mobile-nav button.active {
        color: var(--text);
        font-weight: 700;
      }

      .mobile-nav-icon {
        font-size: 19px;
      }

      .watch-title {
        font-size: 18px;
      }
    }

    @media (max-width: 430px) {
      .brand {
        display: none;
      }

      .search-area {
        width: 100%;
      }

      .header-actions {
        flex-shrink: 0;
      }

      .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header>

    <a href="#" class="brand" onclick="showHome(); return false;">
      <div id="brandLogoContainer"></div>

    </aside>


    <!-- MAIN -->
    <main class="content">

      <!-- HOME -->
      <div id="homePage" class="home-page">

        <!-- CHANNEL -->
        <section class="channel-banner">

          <div class="channel-info">

        <!-- CATEGORIES -->

          <button class="chip" data-filter="videos">

          </button>

          <button class="chip" data-filter="shorts">
            Shorts
          </button>

          <button class="chip" data-filter="ai">
            AI
          </button>

          <button class="chip" data-filter="technology">

          </button>

          <button class="chip" data-filter="datascience">

          </button>

        </div>


        <!-- API STATUS -->

        <!-- VIDEOS -->
        <section id="videosSection">

            <h2>Videos</h2>

                Latest

          </div>

          <div id="shortsGrid" class="shorts-grid"></div>

        </section>


        <!-- FOOTER -->
        <footer>
          <div>
            © <span id="year"></span> Mohakube
          </div>

          <div>
            Videos are embedded from YouTube.
            Mohakube is an independent video-viewing interface.
          </div>
        </footer>

      </div>


      <!-- HISTORY -->
      <div id="historyPage" class="home-page hidden">

        <div class="section-head">
          <h2>Watch History</h2>
          <button class="sort-btn" onclick="clearHistory()">
            Clear History
          </button>
        </div>

        <div id="historyGrid" class="video-grid"></div>

        <p id="historyEmpty" class="history-empty">
          No watch history yet.
        </p>

      </div>


      <!-- WATCH PAGE -->
      <div id="watchPage" class="watch-page">

        <button class="back-btn" onclick="showHome()">
          ← Back
        </button>

        <iframe
          id="player"
          class="player"
          src=""

          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
        ></iframe>

        <h1 id="watchTitle" class="watch-title">
          Loading...
        </h1>

        <div id="watchMeta" class="watch-meta"></div>

      </div>

    </main>

  </div>


  <!-- MOBILE NAV -->
  <nav class="mobile-nav">

    <button class="active" onclick="showHome()">
      <span class="mobile-nav-icon">⌂</span>
      Home
    </button>

    <button onclick="scrollToShorts()">
      <span class="mobile-nav-icon">▣</span>
      Shorts
    </button>

    <button onclick="showHistory()">
      <span class="mobile-nav-icon">◷</span>

    >
      <span class="mobile-nav-icon">▶</span>
      YouTube
    </button>

  </nav>

    function extractVideoId(url) {

      if (!url) return null;

      try {

        const parsed = new URL(url);

        if (
          parsed.hostname.includes("youtube.com") &&
          parsed.pathname.startsWith("/embed/")
        ) {
          return parsed.pathname.split("/embed/")[1].split("/")[0];
        }

        if (
          parsed.hostname.includes("youtube.com") &&
          parsed.pathname.startsWith("/shorts/")
        ) {
          return parsed.pathname.split("/shorts/")[1].split("/")[0];
        }

        if (
          parsed.hostname.includes("youtube.com") &&
          parsed.searchParams.get("v")
        ) {
          return parsed.searchParams.get("v");
        }

        if (parsed.hostname === "youtu.be") {
          return parsed.pathname.substring(1).split("/")[0];
        }

      } catch (error) {
        return null;
      }

      return null;
    }


    function formatViews(value) {

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return "Views unavailable";
      }

      return new Intl.NumberFormat("en-IN", {
        notation: "compact",
        maximumFractionDigits: 1
      }).format(number) + " views";
    }


    function formatDate(date) {

      if (!date) {
        return "Date unavailable";
      }

      const d = new Date(date);

      if (Number.isNaN(d.getTime())) {
        return "Date unavailable";
      }

      return d.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }


    function getRelativeDate(date) {

      if (!date) return "";

      const now = Date.now();
      const then = new Date(date).getTime();

      if (!Number.isFinite(then)) return "";

      const diff = Math.max(0, now - then);

      const minute = 60 * 1000;
      const hour = 60 * minute;
      const day = 24 * hour;
      const month = 30 * day;
      const year = 365 * day;

      if (diff < hour) {
        const n = Math.max(1, Math.floor(diff / minute));
        return n + " min ago";
      }

      if (diff < day) {
        return Math.floor(diff / hour) + " hr ago";
      }

      if (diff < month) {
        return Math.floor(diff / day) + " days ago";
      }

      if (diff < year) {
        return Math.floor(diff / month) + " months ago";
      }

      return Math.floor(diff / year) + " years ago";
    }


    function escapeHTML(value) {

      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function getThumbnail(video) {

      if (video.thumbnail) {
        return video.thumbnail;
      }

      return `https://i.ytimg.com/vi/${video.id}/hqdefault.jpg`;
    }


    function getSearchText(video) {

      return [
        video.title,
        video.channelTitle,
        video.description
      ]
      .join(" ")
      .toLowerCase();

    }


    function matchesCategory(video) {

      if (currentFilter === "all") {
        return true;
      }

      if (currentFilter === "videos") {
        return video.type === "video";
      }

      if (currentFilter === "shorts") {
        return video.type === "short";
      }

      const text = getSearchText(video);

      if (currentFilter === "ai") {
        return text.includes("ai") ||
               text.includes("artificial intelligence") ||
               text.includes("chatgpt") ||
               text.includes("agent");
      }

      if (currentFilter === "technology") {
        return text.includes("technology") ||
               text.includes("wifi") ||
               text.includes("internet") ||
               text.includes("sim") ||
               text.includes("gps") ||
               text.includes("cloud");
      }

      if (currentFilter === "datascience") {
        return text.includes("data science") ||
               text.includes("datascience") ||
               text.includes("data");
      }

      return true;
    }


    function matchesSearch(video) {

      if (!currentSearch) {
        return true;
      }

      return getSearchText(video).includes(
        currentSearch.toLowerCase()
      );

    }


    /* =========================================================
       API
       ========================================================= */

    async function fetchYouTubeVideos(ids) {

      if (!YOUTUBE_API_KEY ||
          YOUTUBE_API_KEY === "YOUR_YOUTUBE_API_KEY") {

        throw new Error(
          "YouTube API key is not configured."
        );

      }

      if (!ids.length) {
        return [];
      }

      const results = [];

      /*
        YouTube videos.list supports multiple IDs per request.
        We split requests into batches to keep the request size safe.
      */

      const batchSize = 50;

      for (let i = 0; i < ids.length; i += batchSize) {

        const batch = ids.slice(i, i + batchSize);

        const params = new URLSearchParams({
          part: "snippet,statistics,contentDetails",
          id: batch.join(","),
          key: YOUTUBE_API_KEY
        });

        const response = await fetch(
          "https://www.googleapis.com/youtube/v3/videos?" +
          params.toString()
        );

        if (!response.ok) {

          let message = "YouTube API request failed.";

          try {
            const errorData = await response.json();

            if (errorData?.error?.message) {
              message = errorData.error.message;
            }
          } catch (_) {}

          throw new Error(message);
        }

        const data = await response.json();

        results.push(...(data.items || []));
      }

      return results;
    }


    async function fetchChannel() {

      if (
        !CHANNEL_ID ||
        CHANNEL_ID === "YOUR_CHANNEL_ID" ||
        !YOUTUBE_API_KEY ||
        YOUTUBE_API_KEY === "YOUR_YOUTUBE_API_KEY"
      ) {
        return null;
      }

      const params = new URLSearchParams({
        part: "snippet,statistics",
        id: CHANNEL_ID,
        key: YOUTUBE_API_KEY
      });

      const response = await fetch(
        "https://www.googleapis.com/youtube/v3/channels?" +
        params.toString()
      );

      if (!response.ok) {
        throw new Error("Unable to load channel data.");
      }

      const data = await response.json();

      return data.items?.[0] || null;
    }


    async function loadYouTubeData() {
  const status = document.getElementById("apiStatus");

  try {
    status.className = "status-box";
    status.textContent = "Loading real YouTube data...";

    const regularIds = VIDEO_LINKS
      .map(extractVideoId)
      .filter(Boolean);

    const shortIds = SHORTS_LINKS
      .map(extractVideoId)
      .filter(Boolean);

    const uniqueIds = [
      ...new Set([...regularIds, ...shortIds])
    ];

    // Videos API — this is the important part
    const videoItems = await fetchYouTubeVideos(uniqueIds);

    const apiMap = new Map(
      videoItems.map(item => [item.id, item])
    );

    allVideos = regularIds
      .map(id => makeVideoObject(apiMap.get(id), "video"))
      .filter(Boolean);

    allShorts = shortIds
      .map(id => makeVideoObject(apiMap.get(id), "short"))
      .filter(Boolean);

    // Channel API is optional
    try {
      channelData = await fetchChannel();
    } catch (channelError) {
      console.warn(
        "Channel API failed:",
        channelError
      );

      channelData = null;
    }

    updateChannelUI();
    renderVideos();
    renderShorts();

    if (!allVideos.length && !allShorts.length) {
      throw new Error(
        "YouTube returned no videos. Check your video IDs and API key."
      );
    }

    status.style.display = "none";

  } catch (error) {

    console.error(error);

    status.className = "status-box error-box";

    status.innerHTML = `
      <strong>YouTube video data could not be loaded.</strong>
      <br><br>
      ${escapeHTML(error.message)}
      <br><br>
      No fake views or fake metadata are being used.
      <br>
      Check your API key, YouTube Data API v3 access,
      and API restrictions.
    `;

    allVideos = [];
    allShorts = [];

    renderVideos();
    renderShorts();
  }
}


    function makeVideoObject(item, type) {

      /*
        IMPORTANT:
        If YouTube doesn't return the video, we DON'T create fake
        metadata. The video is simply skipped.
      */

      if (!item) {
        return null;
      }

      const snippet = item.snippet || {};
      const statistics = item.statistics || {};

      return {

        id: item.id,

        type,

        title: snippet.title || "Title unavailable",

        description:
          snippet.description || "",

        publishedAt:
          snippet.publishedAt || null,

        channelTitle:
          snippet.channelTitle || "YouTube",

        channelId:
          snippet.channelId || CHANNEL_ID,

        thumbnail:
          snippet.thumbnails?.maxres?.url ||
          snippet.thumbnails?.high?.url ||
          snippet.thumbnails?.medium?.url ||
          snippet.thumbnails?.default?.url ||
          null,

        viewCount:
          statistics.viewCount != null
            ? Number(statistics.viewCount)
            : null,

        duration:
          item.contentDetails?.duration || null

      };

    }

    /* =========================================================
       SORT
       ========================================================= */

    function sortVideos(list) {

      const sorted = [...list];

      if (currentSort === "popular") {

        sorted.sort((a, b) => {

          const av =
            a.viewCount == null
              ? -1
              : a.viewCount;

          const bv =
            b.viewCount == null
              ? -1
              : b.viewCount;

          return bv - av;

        });

      } else if (currentSort === "oldest") {

        sorted.sort((a, b) => {

          const ad =
            new Date(a.publishedAt || 0).getTime();

          const bd =
            new Date(b.publishedAt || 0).getTime();

          return ad - bd;

        });

      } else {

        sorted.sort((a, b) => {

          const ad =
            new Date(a.publishedAt || 0).getTime();

          const bd =
            new Date(b.publishedAt || 0).getTime();

          return bd - ad;

        });

      }

      return sorted;

    }

    function renderVideos() {

      const grid =
        document.getElementById("videoGrid");

      grid.innerHTML = "";

      let list = allVideos
        .filter(matchesCategory)
        .filter(matchesSearch);

      list = sortVideos(list);

      if (!list.length) {

        grid.innerHTML = `
          <div class="status-box" style="grid-column:1/-1;">
            No videos found.
          </div>
        `;

        return;
      }

      list.forEach(video => {

        grid.appendChild(
          createVideoCard(video)
        );

      });

    }


    function renderShorts() {

      const grid =
        document.getElementById("shortsGrid");

      grid.innerHTML = "";

      let list = allShorts
        .filter(matchesCategory)
        .filter(matchesSearch);

      list = sortVideos(list);

      if (!list.length) {

        grid.innerHTML = `
          <div class="status-box" style="grid-column:1/-1;">
            No Shorts found.
          </div>
        `;

        return;
      }

      list.forEach(short => {

        grid.appendChild(
          createShortCard(short)
        );

      });

    }


    function createVideoCard(video) {

      const card =
        document.createElement("article");

      card.className = "video-card";

      card.onclick = () =>
        openVideo(video);


      const thumbnail =
        getThumbnail(video);

      card.innerHTML = `

        <div class="thumb-wrap">

          <img
            class="thumb"
            src="${escapeHTML(thumbnail)}"
            alt="${escapeHTML(video.title)}"
            loading="lazy"
          >

        </div>

        <div class="video-info">

          <img
            class="mini-avatar"
            src="${escapeHTML(
              CHANNEL_LOGO ||
              "favicon.png"
            )}"
            alt=""
            loading="lazy"
          >

          <div>

            <div class="video-title">
              ${escapeHTML(video.title)}
            </div>

            <div class="video-meta">
              ${escapeHTML(video.channelTitle)}
            </div>

            <div class="video-meta">
              ${formatViews(video.viewCount)}
              •
              ${getRelativeDate(video.publishedAt)}
            </div>

          </div>

        </div>
      `;

      return card;

    }


    function createShortCard(video) {

      const card =
        document.createElement("article");

      card.className = "short-card";

      card.onclick = () =>

      card.innerHTML = `

        <div class="short-thumb-wrap">

            alt="${escapeHTML(video.title)}"

            ${escapeHTML(video.title)}
          </div>

          <div class="short-meta">
            ${formatViews(video.viewCount)}
            •
            ${getRelativeDate(video.publishedAt)}
          </div>

        </div>
      `;

      return card;

    }


    /* =========================================================
       WATCH
       ========================================================= */

    function openVideo(video) {

      if (!video || !video.id) {
        return;
      }

      saveHistory(video);

      document.getElementById("homePage")
        .classList.add("hidden");

      document.getElementById("historyPage")
        .classList.add("hidden");

      document.getElementById("watchPage")
        .classList.add("active");


      const player =
        document.getElementById("player");

      player.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(video.id) +
        "?autoplay=1&rel=0";


      document.getElementById("watchTitle")
        .textContent = video.title;


      document.getElementById("watchMeta")
        .textContent =
          `${formatViews(video.viewCount)} • ${formatDate(video.publishedAt)}`;


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    /* =========================================================
       HISTORY
       ========================================================= */

    function getHistory() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "mohakube_history"
          ) || "[]"
        );

      } catch (_) {

        return [];

      }

    }


    function saveHistory(video) {

      let history =
        getHistory();

      history =
        history.filter(
          item => item.id !== video.id
        );

      history.unshift({
        ...video
      });

      history =
        history.slice(0, 50);

      localStorage.setItem(
        "mohakube_history",
        JSON.stringify(history)
      );

    }


    function showHistory() {

      document.getElementById("homePage")
        .classList.add("hidden");

      document.getElementById("watchPage")
        .classList.remove("active");

      document.getElementById("historyPage")
        .classList.remove("hidden");

      renderHistory();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    function renderHistory() {

      const grid =
        document.getElementById("historyGrid");

      const empty =
        document.getElementById("historyEmpty");

      const history =
        getHistory();

      grid.innerHTML = "";

      if (!history.length) {

        empty.style.display = "block";

        return;

      }

      empty.style.display = "none";

      history.forEach(video => {

        grid.appendChild(
          createVideoCard(video)
        );

      });

    }


    function clearHistory() {

      localStorage.removeItem(
        "mohakube_history"
      );

      renderHistory();

    }

        .classList.add("hidden");

        .classList.remove("active");

       ========================================================= */

      localStorage.getItem(

    if (savedTheme === "dark") {
      document.body.classList.add("dark");

    function updateThemeButton() {

      const btn =
        document.getElementById("themeBtn");

      btn.textContent =
        document.body.classList.contains("dark")

          : "☀";

    }

        document.body.classList.toggle("dark");
